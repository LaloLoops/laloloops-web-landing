<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} — Lalo Loops</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta property="og:site_name" content="Lalo Loops">
    <meta property="og:title" content="{{TITLE}} — Lalo Loops">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <meta property="og:image" content="https://laloloops.com/header.png">
    <meta property="og:image:width" content="1983">
    <meta property="og:image:height" content="793">
    <meta property="og:image:alt" content="Lalo Loops header illustration showing a senior engineer building agentic workflows with AI helpers.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}} — Lalo Loops">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="twitter:image" content="https://laloloops.com/header.png">
    <meta name="twitter:image:alt" content="Lalo Loops header illustration showing a senior engineer building agentic workflows with AI helpers.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --orange: #E8872B;
            --cream: #FDF0DC;
            --cream-dark: #F0D9B5;
            --black: #1A1A1A;
            --gray: #6B6B6B;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--cream);
            color: var(--black);
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--cream-dark);
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--black);
            text-decoration: none;
        }

        .nav-brand span { color: var(--orange); }

        .nav-links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-links a {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--orange);
            text-decoration: none;
            font-weight: 700;
        }

        .nav-links a:hover { color: var(--black); }

        .article-header {
            margin-bottom: 2rem;
        }

        .article-title {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.5rem;
        }

        .article-meta {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--gray);
            display: flex;
            gap: 1rem;
        }

        .article-body {
            line-height: 1.85;
            font-size: 1.05rem;
        }

        .article-body h1, .article-body h2, .article-body h3 {
            margin: 2rem 0 1rem;
            line-height: 1.3;
        }

        .article-body h1 { font-size: 1.5rem; }
        .article-body h2 { font-size: 1.3rem; }
        .article-body h3 { font-size: 1.1rem; }

        .article-body p { margin-bottom: 1rem; }

        .article-body ul, .article-body ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }

        .article-body li { margin-bottom: 0.5rem; }

        .article-body code {
            font-family: 'Space Mono', monospace;
            background: var(--cream-dark);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .article-body pre {
            background: var(--black);
            color: var(--cream);
            padding: 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .article-body pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .article-body blockquote {
            border-left: 3px solid var(--orange);
            padding-left: 1rem;
            margin: 1.5rem 0;
            color: var(--gray);
            font-style: italic;
        }

        .article-body a {
            color: var(--orange);
            text-decoration: underline;
        }

        .article-body img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .article-body hr {
            border: none;
            border-top: 2px solid var(--cream-dark);
            margin: 2rem 0;
        }

        .article-body em { color: var(--gray); }

        .footer {
            text-align: center;
            padding: 3rem 0 2rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--gray);
            margin-top: 3rem;
            border-top: 2px solid var(--cream-dark);
        }

        .footer .infinity {
            font-size: 1.5rem;
            color: var(--orange);
            display: block;
            margin-bottom: 0.5rem;
        }

        .footer a {
            color: var(--orange);
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover { color: var(--black); }

        @media (max-width: 480px) {
            .container { padding: 1.5rem 1rem; }
            .article-title { font-size: 1.4rem; }
            .article-meta { flex-direction: column; gap: 0.25rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="/" class="nav-brand">Lalo <span>Loops</span></a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/loops/">Loops</a>
                <a href="/articles/">Articles</a>
                <a href="https://x.com/LaloLoops" target="_blank" rel="noopener">Follow on X</a>
            </div>
        </nav>

        <div class="article-header">
            <h1 class="article-title">{{TITLE}}</h1>
            <div class="article-meta">
                <span>{{DATE}}</span>
            </div>
        </div>
        <div class="article-body">
{{BODY}}
        </div>

        <div class="footer">
            <span class="infinity">&infin;</span>
            <a href="/">laloloops.com</a> &middot;
            <a href="/loops/">Loops</a> &middot;
            <a href="/articles/">Articles</a> &middot;
            <a href="https://x.com/LaloLoops" target="_blank" rel="noopener">X</a> &middot;
            <a href="https://github.com/LaloLoops" target="_blank" rel="noopener">GitHub</a>
        </div>
    </div>
</body>
</html>
