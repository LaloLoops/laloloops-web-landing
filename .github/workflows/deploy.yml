name: Deploy to GitHub Pages

on:
  push:
    branches: [main, content]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate loop detail pages
        run: |
          git fetch origin content --depth=1 2>/dev/null || true
          MANIFEST=$(git show origin/content:loops/manifest.json 2>/dev/null || echo '{"loops":[]}')
          echo "$MANIFEST" | python3 -c "
          import json, sys, os, subprocess, html

          manifest = json.load(sys.stdin)
          template = open('loops/_template.html').read()

          for loop in manifest.get('loops', []):
              slug = loop['id']
              title = loop['title']
              date = loop['date']
              loop_num = '#' + slug.split('_')[0]

              md = subprocess.run(
                  ['git', 'show', f'origin/content:loops/{loop[\"file\"]}'],
                  capture_output=True, text=True
              ).stdout

              body = subprocess.run(
                  ['pandoc', '-f', 'markdown', '-t', 'html'],
                  input=md, capture_output=True, text=True
              ).stdout

              page = template.replace('{{TITLE}}', html.escape(title))
              page = page.replace('{{LOOP_NUM}}', html.escape(loop_num))
              page = page.replace('{{DATE}}', html.escape(date))
              page = page.replace('{{BODY}}', body)

              dir_path = f'loops/{slug}'
              os.makedirs(dir_path, exist_ok=True)
              with open(f'{dir_path}/index.html', 'w') as f:
                  f.write(page)
              print(f'Created {dir_path}/index.html')
          "

      - name: Inject Google Analytics
        run: |
          cat > /tmp/ga-snippet.html <<'EOF'
              <!-- Google tag (gtag.js) -->
              <script async src="https://www.googletagmanager.com/gtag/js?id=G-H6BXHR02XR"></script>
              <script>
                  window.dataLayer = window.dataLayer || [];
                  function gtag(){dataLayer.push(arguments);}
                  gtag('js', new Date());
                  gtag('config', 'G-H6BXHR02XR');
              </script>
          EOF
          find . -name "*.html" -not -path "./_site/*" | while read -r file; do
            if ! grep -q "G-H6BXHR02XR" "$file"; then
              sed -i '/<head>/r /tmp/ga-snippet.html' "$file"
            fi
          done

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
