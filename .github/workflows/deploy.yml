name: Deploy to GitHub Pages

on:
  push:
    branches: [main, content]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate content detail pages
        run: |
          pip install markdown
          git fetch origin content --depth=1 2>/dev/null || true
          python3 <<'PYEOF'
          import json, os, subprocess, html
          import markdown as md_lib

          def git_show(path, fallback):
              result = subprocess.run(
                  ['git', 'show', f'origin/content:{path}'],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  return fallback
              return result.stdout

          def render_collection(name, number_token, default_summary):
              manifest_text = git_show(f'{name}/manifest.json', '{"%s":[]}' % name)
              manifest = json.loads(manifest_text)
              template = open(f'{name}/_template.html').read()

              for item in manifest.get(name, []):
                  slug = item['id']
                  title = item['title']
                  summary = item.get('summary', default_summary)
                  date = item['date']
                  item_num = '#' + slug.split('_')[0]
                  canonical_url = f'https://laloloops.com/{name}/{slug}/'

                  md = git_show(f'{name}/{item["file"]}', '')
                  body = md_lib.markdown(md, extensions=['fenced_code', 'tables'])

                  page = template.replace('{{TITLE}}', html.escape(title))
                  page = page.replace('{{DESCRIPTION}}', html.escape(summary))
                  page = page.replace('{{CANONICAL_URL}}', html.escape(canonical_url))
                  page = page.replace(number_token, html.escape(item_num))
                  page = page.replace('{{DATE}}', html.escape(date))
                  page = page.replace('{{BODY}}', body)

                  dir_path = f'{name}/{slug}'
                  os.makedirs(dir_path, exist_ok=True)
                  with open(f'{dir_path}/index.html', 'w') as f:
                      f.write(page)
                  print(f'Created {dir_path}/index.html')

          render_collection('loops', '{{LOOP_NUM}}', 'Dispatch from the loop.')
          render_collection('articles', '{{ARTICLE_NUM}}', 'Longer note from the loop.')
          PYEOF

      - name: Build artifact pages
        run: |
          python3 <<'PYEOF'
          import os, re, html, glob

          artifacts_dir = 'artifacts'
          if not os.path.isdir(artifacts_dir):
              raise SystemExit(0)

          with open(os.path.join(artifacts_dir, '_chrome_head.html')) as f:
              chrome_head = f.read()
          with open(os.path.join(artifacts_dir, '_chrome_top.html')) as f:
              chrome_top = f.read()
          with open(os.path.join(artifacts_dir, '_chrome_bottom.html')) as f:
              chrome_bottom = f.read()
          with open(os.path.join(artifacts_dir, '_index_template.html')) as f:
              index_template = f.read()

          MARKER = '<!-- lalo-chrome-injected -->'
          IMAGE_EXTS = {'.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg'}
          DOC_EXTS = {'.pdf', '.md', '.markdown', '.txt'}

          artifacts = []

          for path in sorted(glob.glob(os.path.join(artifacts_dir, '*'))):
              name = os.path.basename(path)
              if name.startswith('_') or name == 'index.html':
                  continue
              ext = os.path.splitext(name)[1].lower()
              url = '/artifacts/' + name
              kind = ext.lstrip('.') or 'file'
              title = name

              if ext == '.html':
                  with open(path, encoding='utf-8') as f:
                      content = f.read()
                  m = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE | re.DOTALL)
                  if m:
                      title = re.sub(r'\s+', ' ', html.unescape(m.group(1))).strip()
                  description = 'Report, doc, or build output from Lalo Loops.'
                  canonical_url = 'https://laloloops.com' + url
                  page_head = (
                      chrome_head
                      .replace('{{TITLE}}', html.escape(title, quote=True))
                      .replace('{{DESCRIPTION}}', html.escape(description, quote=True))
                      .replace('{{CANONICAL_URL}}', html.escape(canonical_url, quote=True))
                      .replace('{{OG_TYPE}}', 'article')
                  )
                  if MARKER not in content:
                      if '<head>' in content:
                          content = content.replace('<head>', '<head>\n    ' + MARKER + '\n' + page_head, 1)
                      if '<body>' in content:
                          content = re.sub(r'(<body[^>]*>)', lambda mo: mo.group(1) + '\n' + chrome_top, content, count=1)
                      if '</body>' in content:
                          content = content.replace('</body>', chrome_bottom + '\n</body>', 1)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      print(f'Injected chrome into {path}')
              elif ext in IMAGE_EXTS or ext in DOC_EXTS:
                  pass
              else:
                  continue

              artifacts.append({'url': url, 'title': title, 'name': name, 'kind': kind})

          if artifacts:
              items_html = '\n'.join(
                  '            <a href="{url}" class="artifact-item">\n'
                  '                <div class="artifact-item-header">\n'
                  '                    <span class="artifact-item-kind">{kind}</span>\n'
                  '                    <span class="artifact-item-title">{title}</span>\n'
                  '                </div>\n'
                  '                <div class="artifact-item-name">{name}</div>\n'
                  '            </a>'.format(
                      url=html.escape(a['url']),
                      kind=html.escape(a['kind']),
                      title=html.escape(a['title']),
                      name=html.escape(a['name']),
                  )
                  for a in artifacts
              )
          else:
              items_html = '            <div class="empty">No artifacts yet.</div>'

          index_page = index_template.replace('{{ITEMS}}', items_html)
          with open(os.path.join(artifacts_dir, 'index.html'), 'w', encoding='utf-8') as f:
              f.write(index_page)
          print('Generated artifacts/index.html with', len(artifacts), 'item(s)')
          PYEOF

      - name: Inject Google Analytics
        run: |
          cat > /tmp/ga-snippet.html <<'EOF'
              <!-- Google tag (gtag.js) -->
              <script async src="https://www.googletagmanager.com/gtag/js?id=G-H6BXHR02XR"></script>
              <script>
                  window.dataLayer = window.dataLayer || [];
                  function gtag(){dataLayer.push(arguments);}
                  gtag('js', new Date());
                  gtag('config', 'G-H6BXHR02XR');
              </script>
          EOF
          find . -name "*.html" -not -path "./_site/*" | while read -r file; do
            if ! grep -q "G-H6BXHR02XR" "$file"; then
              sed -i '/<head>/r /tmp/ga-snippet.html' "$file"
            fi
          done

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
